<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GP Patient Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>GP Patient Management System</h1>
<div class="container">
        <section>

            <h2>Add Patient</h2>
            <input type="text"
                   id="firstName"
                   placeholder="First Name">
            <input type="text"
                   id="lastName"
                   placeholder="Last Name">
            <input type="date"
                   id="dob">
            <select id="gender">
                <option value="">
                    Select Gender
                </option>
                <option value="Male">
                    Male
                </option>
                <option value="Female">
                    Female
                </option>
            </select>
            <input type="text"
                   id="phone"
                   placeholder="Phone Number">
            <input type="text"
                   id="address"
                   placeholder="Address">
            <input type="text"
                   id="condition"
                   placeholder="Medical Condition">
            <button id="addPatientBtn">
                Add Patient
            </button>
            <p id="message"></p>
        </section>
        <section>


</body>
</html>
